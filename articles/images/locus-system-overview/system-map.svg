<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <rect width="900" height="640" fill="#0d1117"/>
  <text x="450" y="36" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Locus System 全体俯瞰図</text>

  <!-- Center: Locus folder (source of truth) -->
  <rect x="330" y="200" width="240" height="150" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="2.5"/>
  <text x="450" y="228" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="bold">Locusフォルダ（正本）</text>
  <text x="450" y="252" text-anchor="middle" fill="#8b949e" font-size="12">rules.md / ai_handoff.md</text>
  <text x="450" y="272" text-anchor="middle" fill="#8b949e" font-size="12">me.md / log.md</text>
  <text x="450" y="292" text-anchor="middle" fill="#8b949e" font-size="12">projects/ / history/ / skills/</text>
  <text x="450" y="320" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">すべて人が読めるMarkdown</text>
  <text x="450" y="338" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">+ Gitで変更履歴を保持</text>

  <!-- Left: local AI tools, direct read/write -->
  <g>
    <rect x="40" y="120" width="190" height="56" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="135" y="154" text-anchor="middle" fill="#e6edf3" font-size="14">Claude Code</text>
  </g>
  <g>
    <rect x="40" y="192" width="190" height="56" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="135" y="226" text-anchor="middle" fill="#e6edf3" font-size="14">Codex</text>
  </g>
  <g>
    <rect x="40" y="264" width="190" height="56" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="135" y="298" text-anchor="middle" fill="#e6edf3" font-size="14">Gemini CLI / 他</text>
  </g>
  <text x="270" y="220" text-anchor="middle" fill="#58a6ff" font-size="12">直接</text>
  <text x="270" y="237" text-anchor="middle" fill="#58a6ff" font-size="12">読み書き</text>
  <path d="M230,148 L330,255 M230,220 L330,270 M230,292 L330,295" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Below-left: RAG index, built from the folder -->
  <rect x="180" y="440" width="230" height="100" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="295" y="468" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">RAG検索インデックス</text>
  <text x="295" y="490" text-anchor="middle" fill="#8b949e" font-size="11">Ollama(bge-m3) + pgvector</text>
  <text x="295" y="508" text-anchor="middle" fill="#8b949e" font-size="11">Markdownから作り直せる索引</text>
  <path d="M400,350 L340,440" stroke="#d29922" stroke-width="1.5" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="330" y="405" fill="#d29922" font-size="12">変更分だけ反映</text>

  <!-- Below-right: LocusDB, separate structured data store -->
  <rect x="440" y="440" width="230" height="100" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="555" y="463" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">LocusDB</text>
  <text x="555" y="483" text-anchor="middle" fill="#8b949e" font-size="11">食事・体重・歩数などの構造化データ</text>
  <text x="555" y="500" text-anchor="middle" fill="#8b949e" font-size="11">PostgreSQL（RAGとは別のテーブル群）</text>
  <text x="555" y="517" text-anchor="middle" fill="#a371f7" font-size="11">将来: Locusコンシェルジュが利用予定</text>

  <!-- External input to LocusDB: Discord / iPhone -->
  <rect x="440" y="580" width="230" height="44" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="555" y="607" text-anchor="middle" fill="#8b949e" font-size="12">Discord入力 / iPhone歩数(自動)</text>
  <path d="M555,580 L555,540" stroke="#a371f7" stroke-width="1.5" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- Right: Locus API, read-only gateway -->
  <rect x="650" y="215" width="200" height="80" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="750" y="245" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="bold">Locus API</text>
  <text x="750" y="268" text-anchor="middle" fill="#f85149" font-size="12">読み取り専用の窓口</text>
  <path d="M570,260 L650,255" stroke="#f85149" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>

  <!-- Far right: ChatGPT mobile -->
  <rect x="650" y="120" width="200" height="60" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="750" y="155" text-anchor="middle" fill="#e6edf3" font-size="14">ChatGPT（外出中）</text>
  <path d="M750,215 L750,180" stroke="#f85149" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="800" y="202" fill="#f85149" font-size="11">読み取りのみ</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#58a6ff"/></marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#d29922"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f85149"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a371f7"/></marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" fill="#0d1117" font-size="1"> </text>
</svg>
