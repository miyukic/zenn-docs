<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- outer ring: continuity across sessions, with a small gap that the center point bridges -->
  <circle cx="120" cy="120" r="86" fill="none" stroke="url(#ringGrad2)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="520 40" transform="rotate(-96 120 120)"/>

  <!-- center: the fixed locus point -->
  <circle cx="120" cy="120" r="22" fill="#e6edf3"/>
</svg>
