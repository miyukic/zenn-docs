<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="35%" stop-color="#58a6ff"/>
      <stop offset="70%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- orbit ring: the continuing loop across sessions/AIs -->
  <circle cx="120" cy="120" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="466" stroke-dashoffset="26"/>

  <!-- small satellite marks orbiting, representing different AI sessions -->
  <circle cx="120" cy="28" r="9" fill="#3fb950"/>
  <circle cx="212" cy="120" r="7" fill="#58a6ff"/>
  <circle cx="152" cy="202" r="7" fill="#d29922"/>

  <!-- center: the fixed locus / persistent memory point -->
  <circle cx="120" cy="120" r="30" fill="#e6edf3"/>
  <circle cx="120" cy="120" r="30" fill="none" stroke="#0d1117" stroke-width="2"/>
</svg>
