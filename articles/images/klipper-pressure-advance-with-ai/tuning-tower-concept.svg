<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <rect width="900" height="480" fill="#0d1117"/>

  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="bold">TUNING_TOWER の仕組み</text>

  <line x1="140" y1="80" x2="140" y2="400" stroke="#6e7681" stroke-width="2"/>
  <text x="115" y="70" fill="#8b949e" font-size="14">高さ(mm)</text>

  <defs>
    <linearGradient id="towerGradConcept" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="40%" stop-color="#3fb950"/>
      <stop offset="60%" stop-color="#58a6ff"/>
      <stop offset="80%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
  </defs>
  <rect x="220" y="80" width="90" height="320" fill="url(#towerGradConcept)" rx="4"/>

  <g stroke="#30363d" stroke-width="1">
    <line x1="140" y1="400" x2="820" y2="400"/>
    <line x1="140" y1="80" x2="820" y2="80"/>
  </g>

  <text x="130" y="405" text-anchor="end" fill="#8b949e" font-size="14">底(0mm)</text>
  <text x="130" y="85" text-anchor="end" fill="#8b949e" font-size="14">てっぺん</text>

  <text x="330" y="405" fill="#7d8590" font-size="13">PA = START</text>
  <text x="330" y="85" fill="#7d8590" font-size="13">PA = START + 高さ × FACTOR</text>

  <text x="210" y="380" text-anchor="end" fill="#3fb950" font-size="13">角が膨らむ</text>
  <text x="210" y="360" text-anchor="end" fill="#3fb950" font-size="12">(PA不足)</text>

  <text x="210" y="225" text-anchor="end" fill="#58a6ff" font-size="13" font-weight="bold">角がシャープ</text>
  <text x="210" y="245" text-anchor="end" fill="#58a6ff" font-size="12">(適正)</text>

  <text x="210" y="110" text-anchor="end" fill="#f85149" font-size="13">角が薄く途切れる</text>
  <text x="210" y="130" text-anchor="end" fill="#f85149" font-size="12">(PA過多)</text>

  <text x="600" y="240" fill="#8b949e" font-size="14" text-anchor="middle">1回の印刷で、低い方から高い方まで</text>
  <text x="600" y="262" fill="#8b949e" font-size="14" text-anchor="middle">PA値を連続的に変化させながら焼く</text>

  <rect x="460" y="360" width="360" height="60" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="640" y="396" text-anchor="middle" fill="#e6edf3" font-size="15" font-family="monospace">PA = START + 高さ(mm) × FACTOR</text>
</svg>
